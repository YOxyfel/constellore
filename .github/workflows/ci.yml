name: Constellore checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
      - name: Install deterministic audio test dependency
        run: python -m pip install numpy==2.5.0
      - run: npm ci --ignore-scripts
      - run: npm run check

  browser-e2e:
    name: Server runtime / ${{ matrix.label }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium
            browser: chromium
            timeout: 30
            projects: --project=chromium-mobile --project=chromium-desktop --project=chromium-reduced-motion
          - label: WebKit
            browser: webkit
            timeout: 20
            projects: --project=webkit-mobile
          - label: Firefox
            browser: firefox
            timeout: 20
            projects: --project=firefox-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test ${{ matrix.projects }}

  pages-e2e:
    name: Pages runtime / Chromium
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.PUBLIC_FEEDBACK_API_URL }}
          PUBLIC_DUEL_API_URL: ${{ vars.PUBLIC_DUEL_API_URL }}
      - run: npm run check:pages
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.PUBLIC_FEEDBACK_API_URL }}
          PUBLIC_DUEL_API_URL: ${{ vars.PUBLIC_DUEL_API_URL }}
      - run: npm run test:e2e:pages

  itch-package:
    name: Verify deterministic itch package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:itch
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.PUBLIC_FEEDBACK_API_URL }}
          PUBLIC_DUEL_API_URL: ${{ vars.PUBLIC_DUEL_API_URL }}
      - run: npm run check:itch
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.PUBLIC_FEEDBACK_API_URL }}
          PUBLIC_DUEL_API_URL: ${{ vars.PUBLIC_DUEL_API_URL }}
      - name: Upload verified HTML5 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constellore-itch-html5-${{ github.sha }}
          path: |
            dist-itch/*.zip
            dist-itch/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
